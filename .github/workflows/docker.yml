name: Linux Docker Build
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Python unit and Stratum integration tests
        run: python -m unittest discover -v
      - uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build verified Linux VMESH Core and MiniPool Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          load: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            ghcr.io/ati1993de/vargamesh-minipool:latest
            ghcr.io/ati1993de/vargamesh-minipool:${{ github.ref_name }}
      - name: Container startup and dashboard smoke test (main)
        if: github.ref == 'refs/heads/main'
        run: |
          docker compose up -d --no-build
          python scripts/docker_smoke.py
      - name: Show container logs and stop smoke stack
        if: always() && github.ref == 'refs/heads/main'
        run: |
          docker compose ps || true
          docker compose logs --tail=80 || true
          docker compose down || true
      - name: Validate Compose configuration
        run: |
          docker compose -f compose.yaml config --quiet
          STRATUM_BIND_IP=127.0.0.1 docker compose -f compose.yaml -f compose.lan.yaml config --quiet
          MINIPOOL_STRATUM_BIND_IP=0.0.0.0 MINIPOOL_WEB_BIND_IP=0.0.0.0 MINIPOOL_DASHBOARD_ALLOWED_HOSTS=203.0.113.10 docker compose config --format json | python -c "import json,sys; cfg=json.load(sys.stdin); p=cfg['services']['minipool']['ports']; hosts={str(x['target']):x['host_ip'] for x in p}; assert hosts.get('3938')=='0.0.0.0' and hosts.get('8686')=='0.0.0.0', hosts; print('Explicit public binding validated:',hosts)"
