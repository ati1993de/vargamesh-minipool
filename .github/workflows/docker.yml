name: Linux Docker Build
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Python unit and Stratum integration tests
        run: python -m unittest discover -v
      - uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build verified Linux VMESH Core and MiniPool Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            ghcr.io/ati1993de/vargamesh-minipool:latest
            ghcr.io/ati1993de/vargamesh-minipool:${{ github.ref_name }}
      - name: Validate Compose configuration
        run: |
          docker compose -f compose.yaml config --quiet
          STRATUM_BIND_IP=127.0.0.1 docker compose -f compose.yaml -f compose.lan.yaml config --quiet
